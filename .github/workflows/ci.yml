name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        # Oldest and newest supported versions.
        python-version: ["3.10", "3.14"]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install system libraries
        # Open3D needs EGL/GL/OpenMP on headless runners; ffmpeg builds video
        # test fixtures for rotation and edit lists.
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libegl1 libgl1 libgomp1 ffmpeg
      - name: Install package and tooling
        run: python -m pip install -e ".[dev]" -r docs/requirements.txt
      - name: Lint and formatting
        run: |
          ruff check src test
          ruff format --check src test
      - name: Unit tests
        env:
          PYTEST_DISABLE_PLUGIN_AUTOLOAD: "1"
        run: pytest -q
      - name: Documentation
        run: python -m sphinx -W -b html docs docs/_build/html
      - name: Compile and build wheel
        run: |
          python -m compileall -q src test
          python -m pip wheel . --no-deps --wheel-dir dist
